[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jpcb-single-point-energy-ml"
version = "1.2.0"
description = "Local molecular energy, visualization, geometry optimization and ORCA quality-control workbench"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
dependencies = [
  "joblib==1.4.2", "matplotlib==3.10.0", "mordredcommunity==2.0.7",
  "numpy==2.1.3", "pandas==2.2.3", "pillow==11.1.0", "rdkit==2025.9.6",
  "plotly==5.24.1", "scikit-learn==1.6.1", "streamlit==1.45.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

