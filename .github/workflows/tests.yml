name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean Windows installation
        shell: cmd
        run: install_windows.bat
      - name: Test installed application
        shell: cmd
        run: .venv\Scripts\python.exe -m pytest -q
      - name: CLI smoke test
        shell: cmd
        run: run_cli_example.bat

