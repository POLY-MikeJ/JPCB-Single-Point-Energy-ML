name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean Windows installation
        shell: cmd
        run: install_windows.bat
      - name: Test installed application
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pytest -q --junitxml=pytest-results.xml
          if ($LASTEXITCODE -ne 0) {
            [xml]$report = Get-Content pytest-results.xml
            foreach ($case in $report.testsuites.testsuite.testcase) {
              if ($case.failure) {
                $message = ($case.failure.'#text' -replace "`r?`n", '%0A')
                Write-Output "::error title=pytest $($case.classname).$($case.name)::$message"
              }
            }
            exit 1
          }
      - name: CLI smoke test
        shell: cmd
        run: run_cli_example.bat

